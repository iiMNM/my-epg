name: Update EPG

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours (UTC)
  workflow_dispatch:        # manual "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Merge EPG sources
        run: |
          mkdir out && cd out
          python ../merge_epg.py

      # Publish to branch "epg" with a single commit (force push) so the repo never grows
      - name: Publish to epg branch
        run: |
          cd out
          git init -q -b epg
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add epg.xml epg.xml.gz
          git commit -q -m "EPG $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" epg
